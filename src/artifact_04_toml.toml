[package]
name = "solquest"
version = "0.1.0"
description = "Decentralized Developer Onboarding & Hackathon Proof-of-Skill Protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solquest"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
solana-program = "=1.18.26"