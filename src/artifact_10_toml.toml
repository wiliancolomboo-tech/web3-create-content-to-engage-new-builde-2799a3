[package]
name = "hackerforge"
version = "0.1.0"
description = "HackerForge On-Chain Verification Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "hackerforge"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.0", features = ["init-if-needed"] }